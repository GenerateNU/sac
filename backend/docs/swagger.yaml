paths:
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Generates a password reset token
      operationId: forgot-password
      parameters:
      - description: Email
        in: body
        name: email
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utilities.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.Error'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.Error'
      summary: Generates a password reset token
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Logs in a user
      operationId: login-user
      parameters:
      - description: Login Body
        in: body
        name: loginBody
        required: true
        schema:
          $ref: '#/definitions/models.LoginUserResponseBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.Error'
      summary: Logs in a user
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Logs out a user
      operationId: logout-user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utilities.SuccessResponse'
      summary: Logs out a user
      tags:
      - auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: Retrieves the currently authenticated user
      operationId: get-me
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
