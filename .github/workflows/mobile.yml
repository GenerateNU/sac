name: Mobile

permissions: read-all

on:
  push:
    paths:
      - frontend/mobile/**
      - .github/workflows/mobile.yml

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: yarn
          cache-dependency-path: frontend/mobile/yarn.lock
      - name: Install dependencies
        run: |
          cd frontend/mobile
          yarn install
      - name: Format
        run: |
          cd frontend/mobile
          yarn format
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: yarn
          cache-dependency-path: frontend/mobile/yarn.lock
      - name: Install dependencies
        run: |
          cd frontend/mobile
          yarn install
      - name: Lint
        run: |
          cd frontend/mobile
          yarn lint
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: yarn
          cache-dependency-path: frontend/mobile/yarn.lock
      - name: Install dependencies
        run: |
          cd frontend/mobile
          yarn install
      - name: Test
        run: |
          cd frontend/mobile
          yarn test
