name: Dashboard

permissions: read-all

on:
  push:
    paths:
      - frontend/dashboard/**
      - .github/workflows/dashboard.yml
  pull_request:
    types: opened
    paths:
      - frontend/dashboard/**
      - .github/workflows/dashboard.yml

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: yarn
          cache-dependency-path: frontend/dashboard/yarn.lock
      - name: Install dependencies
        run: |
          cd frontend/dashboard
          yarn install
      - name: Format
        run: |
          cd frontend/dashboard
          yarn format
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: yarn
          cache-dependency-path: frontend/dashboard/yarn.lock
      - name: Install dependencies
        run: |
          cd frontend/dashboard
          yarn install
      - name: Lint
        run: |
          cd frontend/dashboard
          yarn lint
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: yarn
          cache-dependency-path: frontend/dashboard/yarn.lock
      - name: Install dependencies
        run: |
          cd frontend/dashboard
          yarn install
      - name: Test
        run: |
          cd frontend/dashboard
          yarn test
