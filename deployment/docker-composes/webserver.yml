services:
  caddy: 
    image: caddy:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
      - 8443:8443
      - 8443:8443/udp
    volumes:
      - $PWD/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
  webserver:
    container_name: sac_webserver
    build:
      context: backend
    env_file:
      - .env

volumes:
  caddy_data:
    external: true
  caddy_config: