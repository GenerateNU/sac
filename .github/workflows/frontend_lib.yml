name: Frontend Lib

permissions: read-all

on:
  push:
    paths:
      - frontend/lib/**
      - .github/workflows/frontend_lib.yml
  pull_request:
    types: opened
    paths:
      - frontend/lib/**
      - .github/workflows/frontend_lib.yml

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: yarn
          cache-dependency-path: frontend/lib/yarn.lock
      - name: Install dependencies
        run: |
          cd frontend/lib
          yarn install
      - name: Format
        run: |
          cd frontend/lib
          yarn format
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: yarn
          cache-dependency-path: frontend/lib/yarn.lock
      - name: Install dependencies
        run: |
          cd frontend/lib
          yarn install
      - name: Lint
        run: |
          cd frontend/lib
          echo "Woah there, we have no we're not linting the lib as of right now. Let's just say we're passing." && exit 0
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: yarn
          cache-dependency-path: frontend/lib/yarn.lock
      - name: Install dependencies
        run: |
          cd frontend/lib
          yarn install
      - name: Test
        run: |
          cd frontend/lib
          yarn test
  release-check:
    name: Release Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Get old version of package.json
        id: get_new_version
        run: |
          echo "::set-output name=new_version::$(jq -r '.version' frontend/lib/package.json)"

      - name: Get old version of package.json
        uses: actions/checkout@v3
        with:
          ref: main
        id: get_old_version
        run: |
          echo "::set-output name=old_version::$(jq -r '.version' frontend/lib/package.json)"

      - name: Compare versions
        run: |
          if [ "${{ steps.get_old_version.outputs.old_version }}" = "${{ steps.get_new_version.outputs.new_version }}" ]; then
            echo "Old and new versions of package.json are identical, please bump the version number"
            exit 1
          else
            echo "New package version idenitied!"
          fi
