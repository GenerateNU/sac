services:
  redis-db-cache:
    build:
      context: .
      dockerfile: Dockerfile.redis
    container_name: redis_db_cache
    ports:
      - 6380:6379
    environment:
      - REDIS_USERNAME=redis_db_cache
      - REDIS_PASSWORD=redis_db_cache!#1
      - REDIS_DISABLE_DEFAULT_USER="true"
    volumes:
      - redis-db-cache-data:/data
  redis-session:
    build:
      context: .
      dockerfile: Dockerfile.redis
    container_name: redis_session
    ports:
      - 6381:6379
    environment:
      - REDIS_USERNAME=redis_session
      - REDIS_PASSWORD=redis_session!#1
      - REDIS_DISABLE_DEFAULT_USER="true"
    volumes:
      - redis-session-data:/data
  redis-limiter:
    build:
      context: .
      dockerfile: Dockerfile.redis
    container_name: redis_limiter
    ports:
      - 6382:6379
    environment:
      - REDIS_USERNAME=redis_limiter
      - REDIS_PASSWORD=redis_limiter!#1
      - REDIS_DISABLE_DEFAULT_USER="true"
    volumes:
      - redis-limiter-data:/data

volumes:
  redis-db-cache-data:
  redis-session-data:
  redis-limiter-data: