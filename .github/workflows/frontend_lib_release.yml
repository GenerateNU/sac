name: Generate SAC Frontend Lib Release

on:
  push:
    paths:
      - "frontend/lib/**"
      - ".github/workflows/frontend_lib_release.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: yarn
          cache-dependency-path: frontend/lib/yarn.lock
      - name: Install dependencies & Test
        run: | 
          cd frontend/lib
          yarn install --frozen-lockfile
          yarn test

  publish-gpr:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          registry-url: https://npm.pkg.github.com/
      - name: Install dependencies & Publish
        run: | 
          cd frontend/lib
          yarn install --frozen-lockfile
          yarn publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
