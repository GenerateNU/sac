services:
  # WEBSERVER
  caddy: 
    image: caddy:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
      - 8443:8443
      - 8443:8443/udp
    volumes:
      - $PWD/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
  webserver:
    container_name: sac_webserver
    build:
      context: ../backend
      dockerfile: ../backend/Dockerfile.server
    env_file:
      - .env.prod

  # REDIS
  redis-session:
    build:
      context: ../backend
      dockerfile: ../backend/Dockerfile.redis
    container_name: redis_session
    ports:
      - "6379"
    environment:
      - REDIS_USERNAME=${SAC_REDIS_SESSION_USERNAME}
      - REDIS_PASSWORD=${SAC_REDIS_SESSION_PASSWORD}
      - REDIS_DISABLE_DEFAULT_USER="true"
    volumes:
      - redis-session-data:/data
  redis-limiter:
    build:
      context: ../backend
      dockerfile: ../backend/Dockerfile.redis
    container_name: redis_limiter
    expose:
      - "6379"
    environment:
      - REDIS_USERNAME=${SAC_REDIS_LIMITER_USERNAME}
      - REDIS_PASSWORD=${SAC_REDIS_LIMITER_PASSWORD}
      - REDIS_DISABLE_DEFAULT_USER="true"
    volumes:
      - redis-limiter-data:/data

  # OPENSEARCH
  opensearch-node1:
    image: opensearchproject/opensearch:latest
    container_name: opensearch-node1
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true # along with the memlock settings below, disables swapping
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m" # minimum and maximum Java heap size, recommend setting both to 50% of system RAM
      - DISABLE_SECURITY_PLUGIN=true #
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536 # maximum number of open files for the OpenSearch user, set to at least 65536 on modern systems
        hard: 65536
    volumes:
      - opensearch-data1:/usr/share/opensearch/data
    ports:
      - 9200:9200
      - 9600:9600 # required for Performance Analyzer
    expose:
      - "9200"
      - "9600"
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: opensearch-dashboards
    ports:
      - 5601:5601
    expose:
      - "5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch-node1:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: true

volumes:
  redis-session-data:
  redis-limiter-data:
  opensearch-data1:
  caddy_data:
    external: true
  caddy_config:
