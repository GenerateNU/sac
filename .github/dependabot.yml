version: 2
updates:
  - package-ecosystem: gomod
    directory: ./backend/
    schedule:
      interval: weekly
    groups:
      backend:
        patterns:
         - "*"
  - package-ecosystem: gomod
    directory: ./cli/
    schedule:
      interval: weekly
    groups:
      cli:
        patterns:
         - "*"
  - package-ecosystem: npm
    directory: ./frontend/mobile/
    schedule:
      interval: monthly
    groups:
      mobile:
        patterns:
         - "*"
  - package-ecosystem: npm
    directory: ./frontend/web/
    schedule:
      interval: monthly
    groups:
      web:
        patterns:
         - "*"
  - package-ecosystem: npm
    directory: ./frontend/dashboard/
    schedule:
      interval: monthly
    groups:
      dashboard:
        patterns:
         - "*"
  - package-ecosystem: npm
    directory: ./frontend/lib/
    schedule:
      interval: monthly
    groups:
      lib:
        patterns:
         - "*"
