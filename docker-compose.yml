  #   volumes:
  #     - $PWD/Caddyfile:/etc/caddy/Caddyfile
  #     - caddy_data:/data
  #     - caddy_config:/config
  
  api:
    container_name: sac_api
    build:
      context: backend
    env_file:
      - config/.env.dev

volumes:
  redis-active-data:
  redis-blacklist-data:
  redis-limiter-data:
